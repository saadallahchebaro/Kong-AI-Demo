<style>
/* Layered reference architecture in the deck's Kong Light theme (deliberately light-only, like the deck).
   Bands: control plane (Konnect) on top; GNB data centre below with consumers, the Kong data plane, upstreams and supporting services.
   Animation = highlights only: numbered steps, feature lines, connectors, outcome tags. */
:root { color-scheme: light;
  --ink: #001408; --ink2: #4B5650; --muted: #6B7069; --line: #D3D9CC; --panel: #F3F5F0; --panel2: #F7F9F4; --lime: #CCFF00; --green: #4A8500;

html, body { height: 100%; }
body { background: var(--white); color: var(--ink); font-family: var(--f); }
.app { height: 100%; box-sizing: border-box; display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 10px; }
@media (max-width: 760px) { .app { height: auto; } .stage { aspect-ratio: 1600 / 770; } }

/* top bar */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.brand { display: grid; gap: 2px; margin-right: auto; min-width: 0; }
.brand .eyebrow { font: 700 12px/1.2 var(--f); letter-spacing: .16em; color: var(--green); text-transform: uppercase; }
.brand b { font: 700 24px/1.1 var(--f); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; background: var(--panel2); }
.seg button { font: 700 13px/1 var(--f); padding: 8px 12px; border: 0; border-radius: 999px; background: none; color: var(--ink2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--lime); }
.scenes { display: flex; flex-wrap: wrap; gap: 6px; }
.scenes button { font: 700 13px/1 var(--f); padding: 8px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--white); color: var(--ink); cursor: pointer; }
.scenes button[aria-current="true"] { background: var(--lime); border-color: var(--ink); }
.ctl { display: inline-flex; gap: 6px; }
.icon { font: 700 13px/1 var(--f); width: 34px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--white); color: var(--ink); cursor: pointer; }
.live { font: 700 12px/1 var(--f); letter-spacing: .1em; padding: 9px 12px; border-radius: 999px; border: 1px solid var(--red); color: var(--red); background: var(--white); cursor: pointer; }
.live[aria-pressed="true"] { background: var(--red); color: var(--white); }
.live[aria-pressed="true"]::before { content: "● "; }
button:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

/* canvas */
.stage { position: relative; min-height: 0; }
svg#svg { display: block; width: 100%; height: 100%; }
svg text { font-family: var(--f); }
.cf { fill: var(--white); stroke: var(--line); stroke-width: 1.3; transition: fill .35s, stroke .35s, stroke-width .35s; }
.cf.dash { stroke-dasharray: 5 4; fill: var(--panel2); }
.cf.gw { fill: var(--panel2); stroke: var(--ink); stroke-width: 2; }
.card { cursor: pointer; }
.card:hover .cf { stroke: var(--green); }
.card.hl .cf { fill: var(--hl); stroke: var(--green); stroke-width: 2.6; }
.card.bad .cf { fill: var(--bad); stroke: var(--red); stroke-width: 2.6; }
.card.down .cf { fill: var(--bad); stroke: var(--red); stroke-dasharray: 6 4; }
.bar-top { fill: var(--lime); }
.ct { font-weight: 700; fill: var(--ink); }
.cl { fill: var(--ink2); }
.cl.strike { fill: var(--red); text-decoration: line-through; }
.cl.hlt { fill: var(--ink); font-weight: 700; }
.bhl { fill: transparent; transition: fill .3s; }
.bm { fill: var(--green); transition: fill .3s; }
.bt { fill: var(--ink); transition: fill .3s; }
.bul.hl .bhl { fill: rgba(204, 255, 0, .55); } .bul.hl .bt { font-weight: 700; }
.bul.bad .bhl { fill: rgba(200, 85, 61, .14); } .bul.bad .bt { fill: var(--red); font-weight: 700; } .bul.bad .bm { fill: var(--red); }
.bul.off { opacity: .35; }
.wire { fill: none; stroke-linejoin: round; }
.glow { fill: none; stroke: var(--lime); stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transition: opacity .35s; }
.glow.on { opacity: .95; }
.glow.red { stroke: rgba(200, 85, 61, .35); }
.wire.cut { stroke: var(--red) !important; stroke-dasharray: 3 6 !important; }
.num .ring { fill: none; stroke: var(--lime); stroke-width: 0; opacity: 0; }
.num.on .ring { animation: ring 1.1s ease-out 2; }

.dots i.on { background: var(--green); }
.foot { font: 400 13px/1.4 var(--f); color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 18px; }
.foot kbd { font: 700 12px var(--f); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: var(--panel2); }

/* inspector + live ticker */
.inspector { position: absolute; top: 8px; right: 8px; bottom: 8px; width: min(420px, calc(100% - 16px)); overflow-y: auto; box-sizing: border-box;

.inspector h3 { margin: 0 36px 2px 0; font: 700 20px/1.2 var(--f); }
.inspector .gnb { margin: 4px 0 12px; color: var(--ink2); }
.inspector .gnb b { color: var(--green); }
.inspector h4 { margin: 14px 0 6px; font: 700 12px/1 var(--f); letter-spacing: .14em; text-transform: uppercase; color: var(--green); }
.inspector table { width: 100%; border-collapse: collapse; font-size: 14px; }
.inspector td { padding: 5px 6px 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.inspector code { font: 13px ui-monospace, Menlo, monospace; overflow-wrap: anywhere; }
.inspector .close { position: absolute; top: 10px; right: 10px; }
.ticker { position: absolute; left: 8px; bottom: 8px; width: min(600px, calc(100% - 16px)); box-sizing: border-box; background: var(--white); border: 1px solid var(--ink);
  border-radius: 10px; padding: 8px 12px; font: 13px/1.6 ui-monospace, Menlo, monospace; }
.ticker b { font: 700 12px var(--f); letter-spacing: .14em; color: var(--red); }
.ticker .row { display: grid; grid-template-columns: 66px minmax(0, 1fr) auto; gap: 10px; white-space: nowrap; }
.ticker .row span { overflow: hidden; text-overflow: ellipsis; }
.ticker .badr { color: var(--red); } .ticker .good { color: var(--green); }

/* slide mode: the deck's body area (2360 x 1000) with a legend column */
.legend { display: none; }
html.slide, html.slide body { width: 2360px; height: 1000px; overflow: hidden; }
html.slide .app { width: 2360px; height: 1000px; padding: 0; gap: 0; grid-template-rows: 1000px; grid-template-columns: 2060px 300px; }
html.slide .bar, html.slide .caption, html.slide .foot, html.slide .ticker, html.slide .inspector { display: none !important; }
html.slide .legend { display: grid; align-content: start; gap: 16px; padding: 26px 18px 20px 14px; font: 400 21px/1.35 var(--f); color: var(--ink2); }
.legend b { color: var(--ink); }
.legend .k { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; }
.legend .src { font-size: 17px; color: var(--muted); }
</style>

</div>

    ] },
    { id: "act3", name: "Act 3 · Tokenomics", steps: [
      S(`Semantic routing: routine questions to ${SMALL.name}, AML analysis to ${LARGE.name}.`, "The prompt's meaning picks the right-sized model; the big GPUs work on what needs them.", async () => { await llm({ pii: true, semantic: true, model: `routine → ${SMALL.name}` }); }),
      S("A reworded repeat is answered from the semantic cache: no model call, zero cost.", `Cache threshold ${pol("semantic-cache")?.settings?.threshold ?? 0.12}, one-hour TTL.`, async () => { await llm({ pii: true, cache: "hit" }); }),
      S("Once the use case's token budget is spent, Kong answers 429 without calling the model.", `Retail copilot: ${lim()}.`, async () => { await llm({ pii: true, block: "budget" }); }),
      S("Tokens and cost per use case arrive in Konnect Analytics, as metadata only.", "Internal prices per model turn tokens into a chargeback view for the CIO.", async () => { await meta(); }),
    ] },
    { id: "act4", name: "Act 4 · Agents", steps: [
      S(`The agent's model calls go through the same policies: ${CLOUD.name} in the demo, the factory's 7B as fallback.`, "Same identity, budget and audit as any other use case.", async () => { await llm({ who: "agents", target: "cloud", model: `200 · ${CLOUD.name}` }); }),
      S(`Tool discovery: the agent's identity sees ${tools.filter((x) => (x.allow || []).includes("card-ops-agent")).length || 3} of ${N(tools.length, 4)} tools.`, `${tools.filter((x) => !(x.allow || []).includes("card-ops-agent")).map((x) => x.name).join(", ") || "block_card"} is hidden from the agent.`, async () => { await tool({ list: true, label: "tools/list · 3 of 4" }); }),
      S("Allowed tools become REST calls to the bank API, audited with the agent and the officer.", "get_card_status, get_kyc_status, escalate_to_supervisor.", async () => { await tool({ label: "get_card_status · 200" }); }),
      S("block_card from the agent is refused, and the refusal is audited. The supervisor's identity may block.", "What an agent may do belongs to its identity, not its code.", async () => { await tool({ deny: true, label: "block_card · 403" }); await tool({ label: "supervisor: block_card · 200" }); }),
    ] },
    { id: "finale", name: "Finale · Konnect cut", steps: [
      S("The link to Konnect is cut.", "Nothing changes for traffic: the data plane runs on its last-known configuration.", async () => { setCut(true); tag("link", "control plane link down", "bad", 3400); await wait(900); }),
      S("Calls keep flowing through every policy group.", "Redaction, guards, budgets and tool permissions all run inside the data centre.", async () => { await llm({ pii: true, model: `200 · ${T1.name}` }); await tool({ list: true, label: "tools/list · still 3" }); }),
      S("The link is restored; the data plane reconnects in seconds with the same configuration.", "For that minute, the only thing lost was the ability to change configuration.", async () => { setCut(false); await meta(); }),
    ] },
    { id: "onboard", name: "13th use case", steps: [
      S("A new use case is 15 lines in Git: a consumer, a key, a group with the reviewed bundle and a standard budget.", `${cfg.onboard?.group || "complaints-copilot"}: ${(cfg.onboard?.policies || BUNDLE).join(", ")}.`, async () => { await cfgPush(`${cfg.onboard?.group || "complaints-copilot"} live`); }),
      S("Its first call goes through the same policies, with a daily budget and the same audit.", "The other eleven pilots go to production the same way.", async () => { await llm({ pii: true, model: `200 · ${T1.name}` }); }),
    ] },
  ];

  // ---------- engine ----------
  let sceneIdx = 0; const nav = $("scenes");
  SCENES.forEach((s, i) => { const b = document.createElement("button"); b.type = "button"; b.textContent = s.name; b.onclick = () => { stopLive(); playFrom(i); }; nav.appendChild(b); });
  function setCaption(s, k) {
    $("cap-scene").textContent = s.name; $("cap-title").textContent = s.steps[k].cap;
    $("cap-sub").innerHTML = esc(s.steps[k].sub) + `<span class="dots">${s.steps.map((_, j) => `<i class="${j <= k ? "on" : ""}"></i>`).join("")}</span>`;
    [...nav.children].forEach((b, j) => b.setAttribute("aria-current", String(j === sceneIdx)));
  }
  function resetState() { setCut(false); setBundle(true); setDown("dc1", false); setDown("dc2", false); L.tags.querySelectorAll(".tag").forEach((t) => t.remove()); }
  async function playFrom(i) {
    tok.alive = false; tok = { alive: true }; const t = tok;
    try { for (let s = i; ; s = (s + 1) % SCENES.length) { sceneIdx = s; resetState(); SCENES[s].setup?.(); for (let k = 0; k < SCENES[s].steps.length; k++) { setCaption(SCENES[s], k); await SCENES[s].steps[k].run(); await wait(SCENES[s].steps[k].hold ?? 1900, t); } await wait(800, t); } }
    catch (e) { if (e !== STOP) console.error(e); }
  }
  function setPlaying(p) { playing = p; $("b-play").textContent = p ? "❚❚" : "▶︎"; $("b-play").setAttribute("aria-label", p ? "Pause" : "Play"); }
  $("b-play").onclick = () => setPlaying(!playing);
  $("b-next").onclick = () => { stopLive(); playFrom((sceneIdx + 1) % SCENES.length); };
  $("b-prev").onclick = () => { stopLive(); playFrom((sceneIdx - 1 + SCENES.length) % SCENES.length); };
  document.addEventListener("keydown", (e) => {
    if (e.key === " ") { e.preventDefault(); setPlaying(!playing); } else if (e.key === "ArrowRight") $("b-next").click(); else if (e.key === "ArrowLeft") $("b-prev").click();
    else if (/^[1-7]$/.test(e.key)) { stopLive(); playFrom(+e.key - 1); } else if (/^[dD]$/.test(e.key)) setView("demo"); else if (/^[pP]$/.test(e.key)) setView("prod"); else if (/^[mM]$/.test(e.key)) setView("map");
    else if (/^[lL]$/.test(e.key) && !$("b-live").hidden) $("b-live").click(); else if (e.key === "Escape") $("inspector").hidden = true;
  });

  // ---------- inspector: the live configuration behind each box ----------
  let lastInspect = null;
  const kv = (o) => `<table>${Object.entries(o || {}).map(([k, v]) => `<tr><td>${esc(k.replace(/_/g, " "))}</td><td><code>${esc(Array.isArray(v) ? v.map((x) => (typeof x === "object" ? JSON.stringify(x) : x)).join(", ") : typeof v === "object" ? JSON.stringify(v) : v)}</code></td></tr>`).join("")}</table>`;
  const polRow = (p) => `<tr><td><b>${esc(p.display_name || p.name)}</b><br><code>${esc(p.type)}</code></td><td>${esc((p.attached_to || []).join(", ") || (BUNDLE.includes(p.name) ? "bundle, attached per use case" : "not attached"))}</td></tr>`;
  const polBlock = (names) => names.map(pol).filter(Boolean).map((p) => `<h4>${esc(p.display_name || p.name)}</h4><table>${polRow(p)}</table>${kv(p.settings)}`).join("");
  const targets = (f) => `<table>${models.flatMap((m) => (m.targets || []).filter(f).map((t) => `<tr><td><b>${esc(t.name)}</b><br><code>${esc(m.name)}</code></td><td>${esc(t.provider)} · port ${esc(t.port)}${t.weight != null ? " · weight " + t.weight : ""}<br>$${t.input_cost} in / $${t.output_cost} out per 1M tokens</td></tr>`)).join("")}</table>`;
  const toolT = () => `<table>${tools.map((x) => `<tr><td><b>${esc(x.name)}</b>${x.destructive ? " · destructive" : ""}<br><code>${esc(x.method)} ${esc(x.path)}</code></td><td>${esc((x.allow || []).join(", "))}</td></tr>`).join("")}</table>`;
  const contL = (s) => { const c = cont(s); return c ? `<p><code>${esc(c.service)}</code> · <code>${esc(c.image)}</code>${c.ports.length ? " · ports " + esc(c.ports.join(", ")) : ""}</p>` : ""; };
  const INFO = {
    cp_config: ["AI Gateway configuration", "Konnect in the ME region; configuration only", () => `${kv({ gateway: cfg.gateway?.display_name, models: models.length, providers: (cfg.providers || []).length, policies: policies.length, "consumer groups": groups.length, consumers: nConsumers, "MCP tools": tools.length, vaults: (cfg.vaults || []).length })}<h4>Policies</h4><table>${policies.map(polRow).join("")}</table>`],
    cp_analytics: ["Analytics", "chargeback per use case from usage metadata", () => `<p>Fed by the data plane's usage metadata: requests, tokens, cost, latency, model, consumer and use case. No prompt or answer text.</p>`],
    cp_code: ["Configuration as code", "a CI pipeline runs kongctl diff on each pull request and apply on merge", () => `<p>Baseline in <code>kong/</code>, the 13th use case in <code>onboard/</code>. <code>kongctl diff -f kong/</code> says "No changes" when Konnect matches Git. Commit <code>${esc(cfg.git_commit)}</code>.</p>`],
    cp_dp: ["Data plane management", "nodes in DC1 and DC2, mTLS certificates, version pinning", () => `<table>${(cfg.nodes || []).map((n) => `<tr><td><b>${esc(n.hostname)}</b></td><td>${esc(n.version)} · ${esc(String(n.compatibility || "").replace("COMPATIBILITY_STATE_", "").toLowerCase().replace(/_/g, " "))}</td></tr>`).join("")}</table>${kv({ "minimum data plane version": cfg.gateway?.min_runtime_version })}`],
    apps: ["Apps & copilots", "channels and staff copilots, each a use case with OIDC tokens", () => `<table>${APP_GROUPS.map((g) => `<tr><td><b>${esc(g.display_name || g.name)}</b><br><code>${esc(g.name)}</code></td><td>${esc((g.consumers || []).map((c) => c.display_name || c.name).join(", "))}<br>${esc((g.policies || []).join(", ") || "no group policies (baseline)")}</td></tr>`).join("")}${cfg.onboard ? `<tr><td><b>${esc(cfg.onboard.group)}</b><br><code>onboard/</code></td><td>${esc(cfg.onboard.consumer_display)} · applied live<br>${esc(cfg.onboard.policies.join(", "))}</td></tr>` : ""}</table>`],
    agents: ["AI agents", "the five agentic use cases, each with its own identity and tool permissions", () => `<table>${AGENT_GROUPS.map((g) => `<tr><td><b>${esc(g.display_name || g.name)}</b><br><code>${esc(g.name)}</code></td><td>${esc((g.consumers || []).map((c) => c.display_name || c.name).join(", "))}</td></tr>`).join("")}</table>`],
    gw: ["Kong AI Gateway · data plane", "stateless nodes on Kubernetes in DC1 and DC2, behind a load balancer", () => `${contL("kong-dp")}<h4>Models</h4><table>${models.map((m) => `<tr><td><b>${esc(m.name)}</b><br><code>${esc((m.route || []).join(", "))}</code></td><td>${esc(m.balancer?.algorithm)} · allow ${esc((m.acl_allow || []).join(", "))}</td></tr>`).join("")}</table>`],
    ep_llm: ["AI Models · /v1", "one OpenAI-compatible endpoint per model", () => targets(() => true)],
    ep_mcp: ["AI MCP Server", "the bank's REST APIs exposed as governed tools", () => `<p><code>${esc(mcp.name)}</code> · ${esc(mcp.type)} · upstream <code>${esc(mcp.upstream)}</code> · server allow list <code>${esc((mcp.acl_allow || []).join(", "))}</code></p>${toolT()}`],
    f_sec: ["Security", "the same reviewed bundle on every use case", () => `<h4>Auth strategy</h4>${kv((cfg.auth || [])[0])}${polBlock(["injection-guard", "pii-redact", "advice-guard", "response-guard"])}`],
    f_gov: ["Governance", "use cases as consumer groups; one audit line per call to the SIEM", () => `<table>${groups.map((g) => `<tr><td><b>${esc(g.name)}</b></td><td>${esc((g.consumers || []).map((c) => c.name).join(", "))}</td></tr>`).join("")}</table>${polBlock(["audit-log", "ai-metrics"])}`],
    f_tok: ["Tokenomics", "budgets per use case, cache where answers are generic, routing across sites and model sizes", () => `${polBlock(["token-budget", "standard-budget", "semantic-cache"])}<h4>Balancers</h4><table>${models.map((m) => `<tr><td><b>${esc(m.name)}</b></td><td>${esc(m.balancer?.algorithm)} · retries ${esc(m.balancer?.retries)}${m.balancer?.fail_timeout ? " · fail_timeout " + m.balancer.fail_timeout + " ms" : ""}</td></tr>`).join("")}</table>`],
    f_ag: ["Agentic", "what an agent may do belongs to its identity", () => `<p>Default for tools without their own rule: <code>${esc((mcp.default_tool_acls || []).join(", "))}</code></p>${toolT()}`],
    factory: ["AI factory", "64 GPUs, 8 nodes × 8, open-weight Arabic-capable models on vLLM", () => targets((t) => t.port !== 443)],
    apis: ["Enterprise APIs", "core banking: card services, KYC, case management", () => `${toolT()}${contL("card-services")}`],
    cloud: ["Cloud LLM", "no route out by default; an approved use case only, redacted first", () => `${targets((t) => t.port === 443)}<p>Its key reaches the data plane from the env vault <code>${esc((cfg.vaults || [])[0]?.name)}</code>; Konnect stores only the reference.</p>`],
    s_idp: ["Identity provider", "GNB's IdP: OIDC tokens whose groups claim selects the use case", () => `${kv((cfg.auth || [])[0])}<p>Production example: <code>examples/oidc-auth-strategy.yaml</code>.</p>`],
    s_vault: ["Secrets vault", "HashiCorp Vault or a KMS, referenced by the providers", () => kv((cfg.vaults || [])[0])],
    s_pii: ["PII service", "Kong's PII service in-cluster; an Arabic model can be plugged in", () => `${contL("pii-service")}${polBlock(["pii-redact"])}`],
    s_vec: ["Vector DB + embeddings", "pgvector (GNB's vector store) with the factory's embedding model", () => `${contL("redis")}<p>Used by the advice guard, the answer check, the semantic cache and semantic routing.</p>`],
    s_siem: ["SIEM & monitoring", "the SIEM via http-log or OpenTelemetry, and GNB's monitoring", () => polBlock(["audit-log", "ai-metrics"])],
  };
  function inspect(id) {
    const info = INFO[id]; if (!info) return; lastInspect = id; const box = $("inspector");
    box.innerHTML = `<button type="button" class="icon close" aria-label="Close">✕</button><h3>${esc(info[0])}</h3><p class="gnb"><b>At GNB:</b> ${esc(info[1])}</p>${info[2]()}`;
    box.querySelector(".close").onclick = () => { box.hidden = true; }; box.hidden = false;
  }
  svg.addEventListener("click", () => { $("inspector").hidden = true; });

  // ---------- live mode: only when served by arch/live.py on the Mac ----------
  let liveSeq = 0, liveTok = null, liveBusy = 0, liveTimer = null; const liveRows = [];
  async function probeLive() { try { const c = new AbortController(); setTimeout(() => c.abort(), 1500); const r = await fetch("live?since=0", { cache: "no-store", signal: c.signal }); if (!r.ok) return false; const j = await r.json(); liveSeq = j.seq || 0; return !!j.status; } catch (e) { return false; } }
  function stopLive() { if (!liveMode) return; liveMode = false; $("b-live").setAttribute("aria-pressed", "false"); $("ticker").hidden = true; if (liveTok) liveTok.alive = false; clearTimeout(liveTimer); resetState(); }
  function startLive() {
    tok.alive = false; resetState(); liveMode = true; liveTok = { alive: true }; $("b-live").setAttribute("aria-pressed", "true"); $("ticker").hidden = false;
    [...nav.children].forEach((b) => b.setAttribute("aria-current", "false"));
    $("cap-scene").textContent = "Live"; $("cap-title").textContent = "Real calls through the data plane on this Mac, highlighted as they happen.";
    $("cap-sub").textContent = "Run any act script in the terminal. Each call is read from the data plane's own log; link and node status from its metrics."; pollLive();
  }
  $("b-live").onclick = () => (liveMode ? (stopLive(), playFrom(sceneIdx)) : startLive());
  function applyStatus(st) {
    if (!st) return;
    if (cutState !== (st.cp_connected === false)) setCut(st.cp_connected === false);
    setDown("dc1", st.ports?.["11501"] === false); setDown("dc2", st.ports?.["11502"] === false);
    for (const [s, c] of [["redis", "s_vec"], ["pii-service", "s_pii"], ["card-services", "apis"]]) if (st.containers && s in st.containers) CARD[c].g.classList.toggle("down", st.containers[s] !== "running");
    if (view === "demo" && st.config_hash) CARD.cp_dp.lines[0].textContent = `node ${node.hostname} · config ${st.config_hash.slice(0, 8)} · ${st.cp_connected ? "connected" : "disconnected"}`;
  }
  function tickerAdd(ev, outcome, good) {
    liveRows.unshift({ t: new Date(ev.t * 1000).toTimeString().slice(0, 8), who: `${ev.consumer || "anonymous"}${ev.use_case ? " · " + ev.use_case : ""}`, outcome, good }); liveRows.length = Math.min(liveRows.length, 6);
    $("ticker").innerHTML = `<b>LIVE · LAST CALLS</b>` + liveRows.map((r) => `<div class="row"><span>${esc(r.t)}</span><span>${esc(r.who)}</span><span class="${r.good ? "good" : "badr"}">${esc(r.outcome)}</span></div>`).join("");
  }
  function animateEvent(ev) {
    const t = liveTok, who = AGENTS.has(ev.consumer) ? "agents" : "apps";
    if (ev.kind === "mcp") { tickerAdd(ev, `${ev.tool || "tools/list"} ${ev.action === "deny" ? "DENY" : "ALLOW"}`, ev.action !== "deny"); return tool({ list: !ev.tool, deny: ev.action === "deny", label: `${ev.tool || "tools/list"} · ${ev.status}`, d: 300 }, t); }
    const ports = ev.ports || [], port = ports[ports.length - 1];
    const o = { who, d: 300, pii: !!ev.sanitized, bundleOff: !ev.sanitized && ev.status !== 403, target: port === 443 ? "cloud" : "factory", dr: port === 11502, failover: ports.length > 1 && ports[0] === 11501 && port === 11502 };  // the sanitizer only runs where the bundle is attached
    let outcome = `${ev.status} · ${ev.model || ""}${ev.tokens ? " · " + ev.tokens + " tok" : ""}`;
    if (ev.cache === "Hit") { o.cache = "hit"; outcome = "cache hit · no model call"; }
    else if (ev.status === 429) { o.block = "budget"; outcome = "429 budget"; }
    else if (ev.status === 401) { o.block = "auth"; outcome = "401 no key"; }
    else if (ev.status === 403 && ev.denied) { o.block = "acl"; outcome = "403 access denied"; }
    else if (ev.status === 403 && ev.llm) { o.block = "answer"; o.model = ev.model; outcome = "403 answer blocked"; }
    else if (ev.status === 403) { o.block = "guard"; o.label = "403 · prompt blocked"; outcome = "403 prompt blocked"; }
    else o.model = `${ev.status} · ${ev.model || ""}`;
    tickerAdd(ev, outcome, ev.status < 400); return llm(o, t);
  }
  async function pollLive() {
    if (!liveMode) return;
    try { const r = await fetch(`live?since=${liveSeq}`, { cache: "no-store" }); const j = await r.json(); applyStatus(j.status);
      for (const ev of j.events || []) { liveSeq = Math.max(liveSeq, ev.seq); if (liveBusy >= 2) { tickerAdd(ev, ev.kind === "mcp" ? (ev.tool || "tools/list") : String(ev.status), ev.status < 400); continue; } liveBusy++; animateEvent(ev).catch(() => {}).finally(() => { liveBusy--; }); } }
    catch (e) { /* local server stopped: keep the last state */ }
    liveTimer = setTimeout(pollLive, 900);
  }

  // ---------- footer, legend, start ----------
  $("foot-src").textContent = `Built from the deployed config: Konnect (${cfg.gateway?.display_name || "AI Gateway"}) and docker-compose.yml · ${cfg.generated_at || ""} · commit ${cfg.git_commit || "?"}`;
  const keyArrow = (c, dash) => `<svg width="44" height="12" viewBox="0 0 44 12"><path d="M2 6H36" stroke="${c}" stroke-width="2.5" ${dash ? `stroke-dasharray="${dash}"` : ""}/><path d="M34 1L43 6L34 11z" fill="${c}"/></svg>`;
  $("legend").innerHTML = `<div class="k">${keyArrow("#001408")}<span><b>AI traffic</b>: prompts, answers, tool calls. Stays inside GNB.</span></div>
    <div class="k">${keyArrow("#4A8500", "6 5")}<span><b>Configuration</b> down, <b>usage metadata</b> up.</span></div>
    <div class="k"><svg width="44" height="26" viewBox="0 0 44 26"><circle cx="13" cy="13" r="12" fill="#001408"/><text x="13" y="18" text-anchor="middle" font-family="Carlito" font-weight="700" font-size="14" fill="#CCFF00">1</text></svg><span><b>Request order</b>, 1 to 5.</span></div>
    <div class="src">Generated from the deployed configuration (Konnect API, docker-compose.yml), ${esc(cfg.generated_at || "")}.</div>`;
  setView(SLIDE ? "map" : "map");
  if (STILL) { $("cap-scene").textContent = "Overview"; $("cap-title").textContent = SCENES[0].steps[1].cap; $("cap-sub").textContent = SCENES[0].steps[1].sub; setPlaying(false); }
  else {  // served by arch/live.py: start live; anywhere else (the published page): play the scenes
    const start = Math.max(0, SCENES.findIndex((s) => s.id === hash));
    probeLive().then((ok) => { if (ok && !hash) { $("b-live").hidden = false; startLive(); } else { if (ok) $("b-live").hidden = false; setTimeout(() => playFrom(start), 500); } });
  }
})();
</script>
