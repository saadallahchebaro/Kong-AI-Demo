# GNB Assist: GNB's employee chat (Open WebUI v0.11.4, branded), in front of the GNB AI Gateway (Kong). Scenario 3 only.
# It reaches Kong on the Mac at :8000 and nothing else.   Start it with 3-cli-ui-webui/scripts/up.sh (not directly).
name: gnb-assist
services:
  gnb-assist:
    build: .
    image: gnb-assist:0.11.4-gnb1
    ports: ["127.0.0.1:3000:8080"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    mem_limit: 1536m
    restart: "no"
    volumes:
      - gnb-assist-data:/app/backend/data
      - ./.login.js:/app/build/static/loader.js:ro   # the sign-in persona picker (login.py, git-ignored); copied to /static at start
    env_file: [.personas.env]          # generated by up.sh, git-ignored: admin bootstrap + session secret (test values)
    environment:
      WEBUI_NAME: "GNB Assist"
      # sign-in per persona; no self-registration
      WEBUI_AUTH: "True"
      ENABLE_SIGNUP: "False"
      DEFAULT_USER_ROLE: "user"
      WEBUI_ADMIN_NAME: "GNB AI Platform"
      # every model goes through Kong: the GNB AI Gateway pipe, and the agents' two connections (setup.py)
      ENABLE_OLLAMA_API: "False"
      ENABLE_OPENAI_API: "True"
      ENABLE_DIRECT_CONNECTIONS: "False"
      OPENAI_API_BASE_URLS: "http://host.docker.internal:8000/v1;http://host.docker.internal:8000/v1"
      OPENAI_API_KEYS: "unused;unused"
      # no background LLM calls (they'd show in the node panes, the audit and the budgets)
      ENABLE_TITLE_GENERATION: "False"
      ENABLE_TAGS_GENERATION: "False"
      ENABLE_FOLLOW_UP_GENERATION: "False"
      ENABLE_AUTOCOMPLETE_GENERATION: "False"
      ENABLE_RETRIEVAL_QUERY_GENERATION: "False"
      ENABLE_SEARCH_QUERY_GENERATION: "False"
      ENABLE_WEB_SEARCH: "False"
      ENABLE_IMAGE_GENERATION: "False"
      ENABLE_CODE_INTERPRETER: "False"
      ENABLE_CODE_EXECUTION: "False"
      ENABLE_MEMORIES: "False"
      ENABLE_NOTES: "False"
      ENABLE_CHANNELS: "False"
      ENABLE_EVALUATION_ARENA_MODELS: "False"
      ENABLE_COMMUNITY_SHARING: "False"
      ENABLE_MESSAGE_RATING: "False"
      SHOW_ADMIN_DETAILS: "False"
      # a bank employee's chat: no model controls, uploads, voice, web or code features
      USER_PERMISSIONS_CHAT_CONTROLS: "False"
      USER_PERMISSIONS_CHAT_VALVES: "False"
      USER_PERMISSIONS_CHAT_SYSTEM_PROMPT: "False"
      USER_PERMISSIONS_CHAT_PARAMS: "False"
      USER_PERMISSIONS_CHAT_FILE_UPLOAD: "False"
      USER_PERMISSIONS_CHAT_WEB_UPLOAD: "False"
      USER_PERMISSIONS_CHAT_STT: "False"
      USER_PERMISSIONS_CHAT_TTS: "False"
      USER_PERMISSIONS_CHAT_CALL: "False"
      USER_PERMISSIONS_CHAT_MULTIPLE_MODELS: "False"
      USER_PERMISSIONS_CHAT_TEMPORARY: "False"
      USER_PERMISSIONS_CHAT_SHARE: "False"
      USER_PERMISSIONS_FEATURES_WEB_SEARCH: "False"
      USER_PERMISSIONS_FEATURES_IMAGE_GENERATION: "False"
      USER_PERMISSIONS_FEATURES_CODE_INTERPRETER: "False"
      USER_PERMISSIONS_FEATURES_NOTES: "False"
      USER_PERMISSIONS_FEATURES_CHANNELS: "False"
      USER_PERMISSIONS_FEATURES_MEMORIES: "False"
      USER_PERMISSIONS_FEATURES_CALENDAR: "False"
      WEBUI_BANNERS: '[{"id":"gnb-internal","type":"info","title":"","content":"GNB internal use · every request is governed by the GNB AI Gateway","dismissible":false,"timestamp":1792540800}]'
      # who is typing, forwarded to Kong (X-OpenWebUI-User-*)
      ENABLE_FORWARD_USER_INFO_HEADERS: "True"
      # nothing leaves the Mac
      OFFLINE_MODE: "True"
      ENABLE_VERSION_UPDATE_CHECK: "False"
      ANONYMIZED_TELEMETRY: "False"
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"
volumes:
  gnb-assist-data: {}
