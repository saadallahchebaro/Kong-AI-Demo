<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- GNB Assist: a fictional mark for the demo (GNB is a fictional bank). A gold "G" with a gateway bar, on deep green. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11634B"/><stop offset="1" stop-color="#08372A"/></linearGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="126" y1="126" x2="386" y2="386"><stop offset="0" stop-color="#E3C46E"/><stop offset="1" stop-color="#B8902F"/></linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="6"/>
  <!-- the G: three-quarter ring, opening at the upper right -->
  <path d="M 357.8 166.4 A 130 130 0 1 0 386 256" fill="none" stroke="url(#gold)" stroke-width="46" stroke-linecap="round"/>
  <!-- the gateway bar into the centre -->
  <path d="M 268 256 H 386" fill="none" stroke="url(#gold)" stroke-width="46" stroke-linecap="round"/>
  <circle cx="380" cy="138" r="17" fill="#E3C46E"/>
</svg>
